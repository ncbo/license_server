# Turnkey stack for the OntoPortal License Server.
#   BP_REST_URL=... API_KEY=... docker compose up --build
# Then browse http://localhost:3000 and log in with BioPortal credentials.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-license_server_production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 3s
      retries: 30

  cache:
    image: memcached:latest
    command: ["-m", "256"]

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      # DB_NAME intentionally unset so each RAILS_ENV uses its own database
      # (license_server_production / _test); see docker/database.yml.
      MEMCACHE_SERVERS: cache:11211
      # Provide these for real use (login + license signing):
      BP_REST_URL: ${BP_REST_URL:-https://data.bioontology.org}
      API_KEY: ${API_KEY:-changeme}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      # Mount a real key and set PRIVATE_KEY_FILE for production licensing.
      # PRIVATE_KEY_FILE: /keys/private.pem
    ports:
      - "3000:3000"

  # Run the test suite:  docker compose run --rm test
  # Built with the test gem group included; only runs under the "test" profile,
  # so a plain `docker compose up` ignores it.
  test:
    profiles: ["test"]
    build:
      context: .
      args:
        BUNDLE_WITHOUT: "deployment"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      BP_REST_URL: ${BP_REST_URL:-https://data.bioontology.org}
      API_KEY: ${API_KEY:-test}
    command: ["bin/rails", "test"]

volumes:
  mysql-data:
